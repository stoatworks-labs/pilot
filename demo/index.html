  <body>
    <main id="demo">
      <noscript>
        <h1>Pilot</h1>
        <p>
          An FFGL effect that loads your clip the way a ZX Spectrum loaded a
          screen: in screen-memory order, at the baud rate, monochrome first and
          colour last, with the border striped by the loading signal itself.
          It's a transition built from an address order rather than a shape, so
          the venetian-blind thirds nobody designed are just where the bytes go.
        </p>
        <p>
          This demo runs the plugin's shaders in your browser, so it needs
          JavaScript and WebGL2. The plugin itself, its source and its downloads
          are on
          <a href="https://github.com/stoatworks-labs/pilot">its repository</a>.
        </p>
        <ul>
          <li><a href="https://stoatworks-labs.com/software/pilot/">Project page and downloads</a></li>
          <li><a href="https://stoatworks-labs.com/software/pilot/guide/">User guide</a></li>
          <li><a href="https://github.com/stoatworks-labs/pilot">Source on GitHub</a></li>
        </ul>
      </noscript>
    </main>
