name: ci

# Until this existed the repo had no workflow with a `pull_request` trigger at
# all — only a tag-driven release — so Dependabot bumps arrived with no status
# check to gate a merge on and simply accumulated.
#
# The FFGL plugin and the harness on macOS only, and deliberately: Windows needs
# GLEW from vcpkg, which is a slow, fragile thing to put in front of every pull
# request for a compile break that would almost certainly show up on macOS too.
# The release workflow still builds both.
#
# The OpenFX plugin is built on macOS (in the same job) AND on Windows, in a
# job of its own with PILOT_BUILD_FFGL=OFF: that configures with nothing but a
# compiler -- no submodule, no vcpkg, no GLEW -- so it is cheap, and MSVC is
# where an OpenFX build has broken before (the LNK1104 race on a shared output
# name). Linux is built and load-tested by the release workflow.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          # The FFGL SDK is a submodule. Without this CMake fails at configure
          # time with a missing-directory error that reads like a broken repo.
          submodules: recursive

      - name: Configure
        # arm64 only, unlike the release build's universal arm64;x86_64 — the
        # second slice doubles the build for no extra signal, because a source
        # break is not architecture-specific. Passed as a single value with no
        # semicolon, which the shell would split.
        #
        # PILOT_BUILD_TOOLS is ON here where the release build turns it OFF:
        # pttest is a large slice of the C++ and the only place the plugin's
        # maths is written down twice, so compiling it is most of the value.
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DPILOT_BUILD_TOOLS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: The model, with no GL context
        # None of these opens a context, so none of them can be a property of
        # a rasteriser or of a raster. Every one runs even after one fails.
        run: |
          failed=""
          for t in agree order thirds attributes border error message clock names negative; do
            ./build/pttest --$t >/dev/null 2>&1 && echo "ok   --$t" || { echo "FAIL --$t"; failed="$failed --$t"; }
          done
          if [ -n "$failed" ]; then echo "failed:$failed"; exit 1; fi

      - name: The checks that rasterise, on the runner's software renderer
        # The runner has no GPU; the harness falls back to Apple's software
        # renderer. These are the checks that could differ from this repo's
        # development GPU, which is exactly why they run here -- --cpu and
        # --transition above all, which hold the OpenFX build's CPU copy of
        # the passes to whatever GPU renders the shaders.
        run: |
          failed=""
          for t in reveal pixels cpu transition; do
            echo "::group::pttest --$t"
            ./build/pttest --$t || failed="$failed --$t"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "failed:$failed"; exit 1; fi

      - name: The OpenFX bundle
        # The same checks verify.sh and the release job make, minus lipo:
        # this build is arm64 only on purpose (see Configure).
        run: |
          ofx=build/Pilot.ofx.bundle
          exe=$( /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$ofx/Contents/Info.plist" )
          test -f "$ofx/Contents/MacOS/$exe" || { echo "CFBundleExecutable '$exe' is not in the bundle"; exit 1; }
          __symbols=$( nm -gU "$ofx/Contents/MacOS/Pilot.ofx" )
          case "$__symbols" in
            *_OfxGetPlugin*) echo "exports OfxGetPlugin" ;;
            *) echo "expected _OfxGetPlugin, got: $__symbols"; exit 1 ;;
          esac
          cp -R "$ofx" "$RUNNER_TEMP/"
          codesign --force --sign - --timestamp=none "$RUNNER_TEMP/Pilot.ofx.bundle"

      - name: Controls
        # Small, because the runner has no GPU and the question is only whether
        # a control changed the picture at all.
        timeout-minutes: 25
        run: python3 tools/sweep.py --size 320x180

      # Uploading is not only for the artefact. This repo has no package
      # manifest, so github-actions is its only Dependabot ecosystem — and a
      # bump to actions/upload-artifact otherwise touches release.yml alone,
      # a workflow no pull request ever runs. Using it here means the check
      # actually exercises the action being bumped.
      - uses: actions/upload-artifact@v7
        with:
          name: pilot-macos-arm64
          path: build/*.bundle
          if-no-files-found: error

  windows-ofx:
    runs-on: windows-latest
    steps:
      # No submodules: the FFGL SDK is the only one, and this job builds none
      # of FFGL. The OpenFX SDK subset is vendored in-tree.
      - uses: actions/checkout@v7

      - name: Configure
        run: >
          cmake -B build -A x64
          -DCMAKE_BUILD_TYPE=Release
          -DPILOT_BUILD_FFGL=OFF
          -DPILOT_BUILD_TOOLS=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: The OpenFX bundle
        shell: bash
        run: |
          so="build/Pilot.ofx.bundle/Contents/Win64/Pilot.ofx"
          test -f "$so" || { echo "no $so"; ls -R build/Pilot.ofx.bundle; exit 1; }
          ls -l "$so"
